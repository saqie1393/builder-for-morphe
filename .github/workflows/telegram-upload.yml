name: Upload APKs to Telegram

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download built APKs from release
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          latest: true
          fileName: "*.apk"
          out-file-path: "./apks"
        continue-on-error: true

      - name: Send APKs to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          # Check if APKs exist
          if [ -d "./apks" ] && [ "$(ls -A ./apks/*.apk 2>/dev/null)" ]; then
            for apk in ./apks/*.apk; do
              echo "Sending $apk..."
              curl -s -F "chat_id=$TG_CHAT" \
                   -F "document=@$apk" \
                   "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
                   || echo "Failed to send $apk"
            done
            echo "All APKs sent!"
          else
            echo "No APKs found to send."
          fi
