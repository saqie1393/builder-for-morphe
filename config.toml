strict-sigcheck = false

# ==========================================
# GLOBAL SETTINGS
# ==========================================
brand = "Morphe"
cli-source = "github:MorpheApp/morphe-cli"
cli-version = "latest"
parallel-jobs = 4

# ==========================================
# YOUTUBE (MorpheApp patches)
# ==========================================
[YouTube]
enabled = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"

[YouTube.patches]
"github:MorpheApp/morphe-patches" = []

# ==========================================
# YT-MUSIC (MorpheApp patches)
# ==========================================
[YT-Music]
enabled = true
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
arch = "all"  # "both" ki jagah "all" recommended

[YT-Music.patches]
"github:MorpheApp/morphe-patches" = []

# ==========================================
# YOUTUBE - anddea patches
# ==========================================
[YouTube_anddea]
enabled = true
brand = "anddea"
app-name = "YouTube"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"

[YouTube_anddea.patches]
"github:anddea/revanced-patches" = { exclude = ["Visual preferences icons for YouTube"] }

# ==========================================
# YT-MUSIC - anddea patches
# ==========================================
[YT-Music_anddea]
enabled = true
brand = "anddea"
app-name = "YT Music"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
arch = "all"

[YT-Music_anddea.patches]
"github:anddea/revanced-patches" = { exclude = ["Visual preferences icons for YouTube Music"] }

# ==========================================
# YOUTUBE - Experimental (MorpheApp dev)
# ==========================================
[YouTube-Experimental]
enabled = true
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
version = "21.26.360"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomIcon=icons/YouTube/branding -OcustomName='YouTube Morphe'"

[YouTube-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

# ==========================================
# X-TWITTER (Piko + x-shim)
# ==========================================
[X-Twitter]
enabled = true
brand = "piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"

[X-Twitter.patches]
"github:crimera/piko" = ["Browse tweet object", "Dynamic color"]
"gitlab:inotia00/x-shim" = { version = "dev" }

# ==========================================
# INSTAGRAM (Piko)
# ==========================================
[Instagram]
enabled = true
brand = "piko"
github-dlurl = "https://github.com/krvstek/uni-storage/releases/tag/instagram"
arch = "arm64-v8a"
version = "auto"

[Instagram.patches]
"github:crimera/piko" = { version = "dev" }

# ==========================================
# TELEGRAM (Paresh patches)
# ==========================================
[Telegram]
enabled = true
brand = "paresh"
apkmirror-dlurl = "https://www.apkmirror.com/apk/telegram-fz-llc/telegram-web-version/"
uptodown-dlurl = "https://telegram.en.uptodown.com/android"

[Telegram.patches]
"gitlab:Paresh-Maheshwari/paresh-patches" = []

# ==========================================
# TRUECALLER (Paresh patches)
# ==========================================
[Truecaller]
enabled = true
brand = "paresh"
apkmirror-dlurl = "https://www.apkmirror.com/apk/true-software-scandinavia-ab/truecaller-caller-id-block/"
uptodown-dlurl = "https://truecaller.en.uptodown.com/android"

[Truecaller.patches]
"gitlab:Paresh-Maheshwari/paresh-patches" = []

# ==========================================
# BAQI SAB APPS (DISABLED)
# ==========================================
[Reddit]
enabled = false
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"

[Reddit.patches]
"github:MorpheApp/morphe-patches" = []

[YouTube-Music-Experimental]
enabled = false
brand = "morphe-dev"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
arch = "both"
version = "9.26.51"
patcher-args = "-e 'Change header' -Ocustom=icons/Music/header -e 'Custom branding' -OcustomIcon=icons/Music/branding -OcustomName='Music Morphe'"

[YouTube-Music-Experimental.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }

# ... (baqi sab apps yahan disabled hain, aap unhe same rakhein)
