strict-sigcheck = false

# ==========================================
# GLOBAL SETTINGS
# ==========================================
brand = "Morphe"
cli-source = "github:MorpheApp/morphe-cli"
cli-version = "latest"
parallel-jobs = 4

# ==========================================
# YOUTUBE - MorpheApp patches
# ==========================================
[YouTube-Morphe]                          # <-- NAME CHANGE
enabled = false
app-name = "YouTube"
brand = "Morphe"
arch = "all"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
patcher-args = "-e 'Change header' -Ocustom=icons/YouTube/header -e 'Custom branding' -OcustomIcon=icons/YouTube/branding -OcustomName='YouTube Morphe'"

[YouTube-Morphe.patches]                  # <-- NAME CHANGE
"github:MorpheApp/morphe-patches" = { version = "dev" }

# ==========================================
# YT-MUSIC - MorpheApp patches
# ==========================================
[YT-Music]
enabled = false
app-name = "YT Music"
brand = "Morphe"
arch = "all"
version = "auto"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"

[YT-Music.patches]
"github:MorpheApp/morphe-patches" = []

# ==========================================
# YOUTUBE - anddea patches (ReVanced Extended)
# ==========================================
[YouTube-anddea]                          # <-- NAME CHANGE
enabled = false
app-name = "YouTube"
brand = "ReVanced-Extended"
arch = "all"
version = "auto"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube/"
patcher-args = """
    -e 'MaterialYou' \
    -e 'Return YouTube Username' \
    -e 'Custom branding icon for YouTube' -OappIcon='mmt_turquoise' -OchangeSplashIcon='true' -OrestoreOldSplashAnimation='true' \
    -e 'Custom header for YouTube' -OcustomHeader='custom_branding_icon' \
    -e 'Theme' -OdarkThemeBackgroundColor=@android:color/black \
    -e 'Settings for YouTube' -OrvxSettingsLabel='Revanced Extended' -OinsertPosition=@string/about_key
    """

[YouTube-anddea.patches]                  # <-- NAME CHANGE
"github:anddea/revanced-patches" = { version = "dev", include = ["Custom header for YouTube"], exclude = ["Custom branding name for YouTube", "Visual preferences icons for YouTube"] }

# ==========================================
# X-TWITTER (Piko + x-shim)
# ==========================================
[X-Twitter]
enabled = false
brand = "piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"

[X-Twitter.patches]
"github:crimera/piko" = ["Browse tweet object", "Dynamic color"]
"gitlab:inotia00/x-shim" = { version = "dev" }

# ==========================================
# INSTAGRAM (Piko)
# ==========================================
[Instagram]
enabled = true
brand = "piko"
github-dlurl = "https://github.com/krvstek/uni-storage/releases/tag/instagram"
apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"
arch = "arm64-v8a"
version = "435.0.0.37.76"

[Instagram.patches]
"github:crimera/piko" = { version = "dev" }

# ==========================================
# TELEGRAM (Paresh patches)
# ==========================================
[Telegram]
enabled = false
brand = "paresh"
apkmirror-dlurl = "https://www.apkmirror.com/apk/telegram-fz-llc/telegram-web-version/"
uptodown-dlurl = "https://telegram.en.uptodown.com/android"

[Telegram.patches]
"gitlab:Paresh-Maheshwari/paresh-patches" = []

# ==========================================
# TRUECALLER (Paresh patches)
# ==========================================
[Truecaller]
